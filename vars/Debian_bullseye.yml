---
source_list_entries:
  - deb http://archive.debian.org/debian %s main
  - deb http://archive.debian.org/debian %s-updates main
  # Bullseye is still in LTS, so it still gets security updates.
  #
  # Also note that the format of the security entry has changed
  # slightly.  See https://forums.debian.net/viewtopic.php?t=151142
  # for more details about that.
  #
  # The check-valid-until is currently necessary for Bullseye.  For
  # more details see the discussion at https://snapshot.debian.org/.
  - >-
    deb [check-valid-until=no]
    http://security.debian.org/debian-security %s-security main

# The Debian releases for which we must use these archive repositories
supported_releases:
  - bullseye
